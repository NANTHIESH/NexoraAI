[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-ai"
version = "0.1.0"
description = "Local multi-agent RAG business assistant for small businesses."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests", "app", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_data.py" = ["E501"]  # wide catalog tables
"src/nexora/rag/prompts.py" = ["E501"]  # prompt prose
"src/nexora/agents/router.py" = ["E501"]  # prompt prose
"app/*.py" = ["E501"]  # UI layout lines
"app/pages/*.py" = ["E501"]
"src/nexora/agents/memory.py" = ["E501"]  # prompt prose
"src/nexora/agents/lookups.py" = ["E501"]  # regex vocab and user-facing text
