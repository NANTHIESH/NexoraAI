[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-ai"
version = "0.1.0"
description = "Local multi-agent RAG business assistant for small businesses."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests", "app", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_data.py" = ["E501"]  # wide catalog tables
"src/nexora/rag/prompts.py" = ["E501"]  # prompt prose
